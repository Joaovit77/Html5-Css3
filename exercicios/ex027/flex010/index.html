<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item{
            background-color: lightskyblue;
            border: 1px solid black;
            flex-basis: 200px;
            text-align: center;
            flex-shrink: 1;
        }

        #a1{
            flex-grow: 0;
        }

        #b1{
            flex-grow: 1;
        }

        #c1{
            flex-grow: 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="a1" class="item">A</div>
        <div id="b1" class="item">B</div>
        <div id="c1" class="item">C</div>
    </div>
</body>
</html>
